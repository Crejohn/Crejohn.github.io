             each container can specify an independent "portada" image via
             the data-cover attribute. the URL may point to any file and does
             not need to be part of the gallery content.

             the script now also provides a fallback: if a group has no
             explicit cover, the first anchor's image will be used automatically
             and the element will still receive the `has-cover` class. this
             ensures **every** container displays a tile even if you haven't
             manually added covers.

             additionally, containers with a cover receive an overlay that
             fades out on hover (the same opacity effect that was previously
             applied to the first-anchor image). this gives a unified mouseover
             experience no matter how the cover is supplied.

             example with explicit cover:
        -->
  <!-- two new attributes allow full control over the overlay box that sits
       behind the text. values are read from each group independently so
       changing one does not affect the others.

       * `data-box-color` – any valid CSS color for the box (hex, named, etc.)
       * `data-box-opacity` – a number between 0 and 1 controlling transparency

       the script combines color+opacity when both are supplied. example:
       data-box-color="#ff0" data-box-opacity="0.4" -->
  <div class="gallery-container group" id="gallery-holidays" data-cover="./images/holidays/holidays_cover.avif" data-content-pos="center-left" data-title-size="25px" data-paragraph-size="16px" data-padding-vertical="12%" data-padding-horizontal="8%" data-title-text-color="#ffffff" data-paragraph-text-color="#ffffff" data-box-color="#3E3B39" data-box-opacity="0.4">
          <a href="./images/holidays/holidays_1.avif"
             data-title="Salón Holidays: Celebrate Beyond Expectations"
             data-paragraph="Step into a world where elegance is default and memorable moments are standard. At Salón Holidays, we understand that details matter. From fresh floral artistry to premium tableware, every element is curated to reflect your unique vision. We craft experiences, not just events, ensuring every guest feels the difference of true bespoke design."
             data-thumb="./images/holidays/holidays_cover.avif"><img alt="holidays-1" src="./images/holidays/holidays_cover.avif" /></a>
          <a href="./images/holidays/holidays_2.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_2.avif"
             data-title="Visual Identity & Atmosphere"
             data-paragraph="The visual identity is rooted in a palette of organic earths and deep chocolates, drawing inspiration from the brutalist and modern architecture of Caracas. By blending raw textures with clean, contemporary lines, the brand evokes a sense of 'Timeless Luxury.' This direction prioritizes tactile sophistication—where the grain of the stone and the warmth of the light work together to create an inviting, high-end sanctuary."><img src="./images/holidays/holidays_2.avif" alt="" /></a>
          <a href="./images/holidays/holidays_3.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_3.avif"
             data-title="Logo Clearspace & Visual Integrity"
             data-paragraph="To maintain the brand’s premium positioning, a dedicated 'safe zone' is established. This clearspace ensures the Salón Holidays identity remains unobstructed by secondary elements, preserving its visual impact across all touchpoints. By adhering to these precise geometric constraints, the mark retains its balance, legibility, and architectural presence in any environment."><img src="./images/holidays/holidays_3.avif" alt="" /></a>
          <a href="./images/holidays/holidays_4.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_4.avif"
             data-title="The Visual Voice: Typography & Palette"
             data-paragraph="The brand's character is defined by a sophisticated tension between tradition and modernity. Helvetica Neue LT Std provides a clean, architectural structure, while Gill Sans Light adds a touch of humanist elegance and warmth. This typographic pairing is anchored by a curated duo-tone palette: a deep, grounded chocolate and a luminous, warm sand. Together, these assets create a high-contrast visual language that feels both authoritative and inviting."><img src="./images/holidays/holidays_4.avif" alt="" /></a>
          <a href="./images/holidays/holidays_5.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_5.avif"
             data-title="The Power of the First Touchpoint"
             data-paragraph="A brand is experienced through its details. The Salón Holidays business card is designed to be a physical extension of the venue’s elegance. Utilizing a high-contrast layout and premium rounded finishes, the stationery creates an immediate sense of prestige. Every interaction begins with a statement of quality, ensuring the brand remains memorable long after the first meeting."><img src="./images/holidays/holidays_5.avif" alt="" /></a>
          <a href="./images/holidays/holidays_6.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_6.avif"
             data-title="Elevated Gifting: A Signature Touch"
             data-paragraph="At Salón Holidays, the experience begins before the first toast. This bespoke welcome gift box is a tangible gesture of premium hospitality. Designed with a clean, architectural aesthetic, the packaging mirrors the venue's own refined atmosphere. It’s a curated introduction to a world of luxury, ensuring every guest feels the weight of the brand’s commitment to excellence from the very start."><img src="./images/holidays/holidays_6.avif" alt="" /></a>
          <a href="./images/holidays/holidays_7.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_7.avif"
             data-title="A Tabletop Signature: Gastronomic Branding"
             data-paragraph="Function meets elegance in the Salón Holidays menu system. This piece utilizes the brand’s primary typographic pairing to create a clear, unobstructed reading experience. The restricted use of the signature chocolate tone for the headings creates a rhythmic flow that guides the guest through the selection. It is a testament to the brand’s commitment to 'Functional Luxury,' where every design choice serves both form and utility."><img src="./images/holidays/holidays_7.avif" alt="" /></a>
          <a href="./images/holidays/holidays_8.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_8.avif"
             data-title="Environmental Presence: The Signature of La Castellana"
             data-paragraph="A brand's strength is measured by its adaptability across environments. The Salón Holidays exterior sign demonstrates the versatility of the mark, maintaining absolute legibility from a distance through high-contrast typography and a restricted color story. This touchpoint serves as the first visual introduction for arriving guests, promising an interior experience that is just as refined, organized, and elegant as the entrance suggests."><img src="./images/holidays/holidays_8.avif" alt="" /></a>
          <a href="./images/holidays/holidays_9.avif" class="hidden-image"
             data-thumb="./images/holidays/holidays_9.avif"
             data-title="Digital Presence: The Visual Journey."
             data-paragraph="Beyond the event, the brand lives in the lifestyle of its guests. The social media direction for Salón Holidays is built on authenticity and aspirational beauty. Through a strategic mix of behind-the-scenes glimpses and polished event highlights, the brand fosters a community of elegance. It is a digital sanctuary that captures the fleeting moments of celebration and turns them into a lasting brand legacy."><img src="./images/holidays/holidays_9.avif" alt="" /></a>
        </div>
  <div class="gallery-container group" id="gallery-dhv" data-cover="./images/dhv/dhv_cover.avif" data-title-size="25px" data-paragraph-size="16px" data-padding-vertical="12%" data-padding-horizontal="8%" data-title-text-color="#f0f0f0" data-paragraph-text-color="#f0f0f0" data-box-color="#3E3B39" data-box-opacity="0.4">
         <a href="./images/dhv/dhv_1.avif"
            data-title="Building the Vision"
            data-paragraph="The DHV visual identity is built upon a foundation of structural integrity and modern sophistication. Designed to represent the rising skyline of Venezuela's hospitality sector, the mark balances architectural precision with timeless serif typography, establishing a commanding presence in the luxury development market."><img alt="dhv-2" src="./images/dhv/dhv_1.avif" /></a>     
         <a href="./images/dhv/dhv_2.avif"
            data-title="Concept Evolution"
            data-paragraph="Inspiration for this identity is drawn from the monumental scale of urban development and the timeless textures of the earth. The color story—a curated range of architectural grays—reflects the materials of construction: stone, concrete, and steel. This moodboard serves as the conceptual blueprint for the brand, ensuring every touchpoint resonates with the strength of an iconic skyline and the serenity of a panoramic horizon."><img alt="dhv-2" src="./images/dhv/dhv_2.avif" /></a>
         <a href="./images/dhv/dhv_3.avif" class="hidden-image" data-thumb="./images/dhv/dhv_3.avif"
            data-title="Structural Geometry & Proportions"
            data-paragraph="The DHV logotype is built on a rigorous geometric grid to ensure visual equilibrium across all scales. By aligning the vertical ascent of the iconography with the x-height of the serif typography, the mark achieves a rhythmic 'architectural silhouette.' Every stroke and counter-form is calculated to maintain structural integrity, mirroring the precision required in large-scale hospitality development."><img src="./images/dhv/dhv_3.avif" alt="" /></a>
         <a href="./images/dhv/dhv_4.avif" class="hidden-image" data-thumb="./images/dhv/dhv_4.avif"
            data-title="Identity Architecture & Scale"
            data-paragraph="The DHV brand system is created for maximum versatility. By deconstructing the primary signature into vertical and iconographic orientations, the identity maintains its structural impact across diverse spatial constraints. The secondary vertical lockup and the standalone emblem are governed by the same proportional grid, ensuring a cohesive brand experience whether utilized in grand-scale signage or high-density digital interfaces."><img src="./images/dhv/dhv_4.avif" alt="" /></a>
         <a href="./images/dhv/dhv_5.avif" class="hidden-image" data-thumb="./images/dhv/dhv_5.avif"
            data-title="The Signature Impression"
            data-paragraph="Beyond digital borders, the DHV mark is designed for physical distinction. Whether through embossing, foil stamping, or specialized print finishes, the visual system maintains its structural clarity. This material study highlights the transition from graphic design to architectural branding, reinforcing the company's status as a leader in premium infrastructure and hospitality."><img src="./images/dhv/dhv_5.avif" alt="" /></a>
         <a href="./images/dhv/dhv_6.avif" class="hidden-image" data-thumb="./images/dhv/dhv_6.avif"
            data-title="Executive Correspondence & Networking"
            data-paragraph="The DHV business card is the primary physical touchpoint for professional engagement. Adhering to a philosophy of 'Quiet Luxury,' the layout prioritizes white space and typographic hierarchy to ensure clarity and prestige. By centering the brand mark above the executive details, the card establishes an immediate sense of leadership and architectural stability, serving as a pocket-sized representation of the company’s grander vision."><img src="./images/dhv/dhv_6.avif" alt="" /></a>
         <a href="./images/dhv/dhv_7.avif" class="hidden-image" data-thumb="./images/dhv/dhv_7.avif"
            data-title="Functional Identity: Guest Communication"
            data-paragraph="A brand is a promise of service. This execution highlights the utility of the DHV visual system in real-world hospitality scenarios. The layout utilizes a structured grid that balances iconography with clear, authoritative messaging. By grounding the communication in the same geometric principles as the primary logo, the design reinforces a sense of order and high-level hospitality management, even in the smallest details of the room experience."><img src="./images/dhv/dhv_7.avif" alt="" /></a>
         <a href="./images/dhv/dhv_8.avif" class="hidden-image" data-thumb="./images/dhv/dhv_8.avif"
            data-title="Environmental Identity & Transparency"
            data-paragraph="Visual weight and transparency are balanced through this etched glass application. The structural verticality of the DHV emblem is highlighted against the soft focus of the hotel interior, creating a layered brand experience. This strategic placement ensures the identity remains visible and authoritative while allowing the luxury of the physical space to speak. It is an exercise in restraint—where the absence of color emphasizes the purity of form and the quality of the hospitality brand."><img src="./images/dhv/dhv_8.avif" alt="" /></a>
         <a href="./images/dhv/dhv_9.avif" class="hidden-image" data-thumb="./images/dhv/dhv_9.avif"
            data-title="Public-Facing Brand Identity"
            data-paragraph="A project’s identity must transition seamlessly from the internal guest experience to the external public domain. This signage system translates the brand’s refined geometry into a functional navigational tool. The balance between the monolithic emblem and the traditional wordmark ensures that the company name is legible across varied lighting conditions, establishing an authoritative presence at every physical location."><img src="./images/dhv/dhv_9.avif" alt="" /></a>
        </div>
  <div class="gallery-container group" id="gallery-altavista" data-cover="./images/altavista/altavista_cover.avif" data-title-size="25px" data-paragraph-size="16px" data-padding-vertical="12%" data-padding-horizontal="8%" data-title-text-color="#f0f0f0" data-paragraph-text-color="#f0f0f0" data-box-color="#3E3B39" data-box-opacity="0.4">
         <a href="./images/altavista/altavista_1.avif"
            data-title="The Foundation"
            data-paragraph="Publicidad Altavista is a full-service creative agency that specializes in bridging the gap between traditional craftsmanship and modern advertising solutions. Located in the heart of an urban landscape, the agency focuses on empowering local businesses by providing high-impact visual communication, from large-scale outdoor signage to intricate brand identity systems. They thrive on the ´Altavista´ perspective; elevating a brand’s visibility through strategic design that remains accessible and community-oriented."><img alt="altavista-1" src="./images/altavista/altavista_1.avif" /></a>
         <a href="./images/altavista/altavista_2.avif" class="hidden-image" data-thumb="./images/altavista/altavista_2.avif"
            data-title="Structural Influence"
            data-paragraph="This collection of imagery served as the blueprint for the agency's visual language. The fluid motion of water and the rugged edges of stone directly influenced the balance of the serif typography and the solid weight of the isotype. These references ensure the brand carries a sense of permanence and adaptability, translating the strength of the physical landscape into a modern, high-impact digital presence."><img src="./images/altavista/altavista_2.avif" alt="" /></a>
         <a href="./images/altavista/altavista_3.avif" class="hidden-image" data-thumb="./images/altavista/altavista_3.avif"
            data-title="Logo Architecture"
            data-paragraph="Precise spacing and alignment define the core of Publicidad Altavista. The brand system offers flexible lockups—primary horizontal, stacked vertical, and a standalone icon—to adapt to any spatial constraint. Every angle and line is governed by a defined clearance zone, guaranteeing the brand remains prominent and legible in every environment."><img src="./images/altavista/altavista_3.avif" alt="" /></a>
         <a href="./images/altavista/altavista_4.avif" class="hidden-image" data-thumb="./images/altavista/altavista_4.avif"
            data-title="Letterforms and Tonality"
            data-paragraph="Choosing Bodoni Moda and Inter ensures the brand remains legible and sophisticated at any scale. The heart of the identity lies in the abstract monogram. By merging the vertical stability of the ‘A’ with the expanding perspective of the ‘V,’ the mark creates a sense of upward momentum. The overlapping diagonals represent a blend of creativity and precision, forming a signature that works as a standalone mark or as a companion to the typography. It is a compact, recognizable icon built for high visibility in any urban environment."><img src="./images/altavista/altavista_4.avif" alt="" /></a>
         <a href="./images/altavista/altavista_5.avif" class="hidden-image" data-thumb="./images/altavista/altavista_5.avif"
            data-title="Physical Branding"
            data-paragraph="Outdoor assets prioritize immediate recognition. The stacked configuration of the Publicidad Altavista mark is utilized here to maximize the vertical space of the banner. Against a neutral building facade, the teal isotype pops, drawing the eye directly to the center of the composition. This application highlights the brand's versatility—maintaining its sophisticated edge while functioning as a clear, navigational landmark."><img src="./images/altavista/altavista_5.avif" alt="" /></a>
         <a href="./images/altavista/altavista_6.avif" class="hidden-image" data-thumb="./images/altavista/altavista_6.avif"
            data-title="The Minimalist Identity Approach"
            data-paragraph="Removing the wordmark allows the isotype to speak for itself. In this context, the sharp diagonals and intersecting planes create a modern aesthetic that fits perfectly with contemporary street-style. This execution highlights the brand's ability to be recognizable through a single symbol, proving the efficiency of its minimalist construction."><img src="./images/altavista/altavista_6.avif" alt="" /></a>
         <a href="./images/altavista/altavista_7.avif" class="hidden-image" data-thumb="./images/altavista/altavista_7.avif"
            data-title="Navigating the Brand"
            data-paragraph="In a digital context, the Publicidad Altavista system prioritizes speed and clarity. The responsive layout adapts the logo to fit various screen scales without losing its geometric detail. By pairing bold headlines with the agency’s signature color accents, the site creates a professional and trustworthy atmosphere. This application demonstrates the brand's versatility, proving the identity remains cohesive whether it’s printed on a banner or rendered in pixels."><img src="./images/altavista/altavista_7.avif" alt="" /></a>
         <a href="./images/altavista/altavista_8.avif" class="hidden-image" data-thumb="./images/altavista/altavista_8.avif"
            data-title="Brand Awareness"
            data-paragraph="The Publicidad Altavista identity is designed to thrive in real-world lighting and diverse urban textures. When applied to back-lit transit displays, the saturation of the teal palette creates a vibrant glow that commands the sidewalk. The architectural nature of the isotype aligns with the surrounding city structures, reinforcing the idea of a brand that is built for the local community but maintains a high-end, contemporary finish."><img src="./images/altavista/altavista_8.avif" alt="" /></a>
         <a href="./images/altavista/altavista_9.avif" class="hidden-image" data-thumb="./images/altavista/altavista_9.avif"
            data-title="Everyday Engagement"
            data-paragraph="High-traffic transit environments allow the identity to live where the people are. By placing the brand in the daily path of commuters, Publicidad Altavista moves beyond a digital screen and becomes a familiar part of the urban landscape. This proximity builds a level of accessibility and trust that static office-bound branding cannot achieve. It is about being present in the moments when the community is moving, thinking, and looking for their next big idea.9"><img src="./images/altavista/altavista_9.avif" alt="" /></a>
        </div>
  <div class="gallery-container group" id="gallery-outletmix" data-cover="./images/outletmix/outletmix_cover.avif" data-title-size="25px" data-paragraph-size="16px" data-padding-vertical="12%" data-padding-horizontal="8%" data-title-text-color="#f0f0f0" data-paragraph-text-color="#f0f0f0" data-box-color="#3E3B39" data-box-opacity="0.4">
         <a href="./images/outletmix/outletmix_1.avif"
            data-title="Brand Core"
            data-paragraph="Outletmix is a high-energy sportswear retailer dedicated to making premium-feel athletic gear accessible to everyone. By blending a modern aesthetic with an inclusive approach, Outletmix empowers the everyday athlete to perform at their best without the financial barrier of luxury labels. It’s about the grind, the sweat, and the result."><img alt="outletmix-1" src="./images/outletmix/outletmix_cover.avif" /></a>
         <a href="./images/outletmix/outletmix_2.avif" class="hidden-image" data-thumb="./images/outletmix/outletmix_2.avif"
            data-title="Visual Inspiration & Energy"
            data-paragraph="The foundation of the brand is rooted in the raw energy of the everyday athlete. Whether it’s a morning jog through the city or a high-intensity training session, the focus is on fluid motion and personal progress. The color palette is a direct reflection of this active lifestyle. CMYK Red delivers a high-impact punch that suggests speed and passion, while the deep Black provides a grounded, professional edge. These tones work together to create a look that is both aspirational and deeply practical for any environment."><img src="./images/outletmix/outletmix_2.avif" alt="" /></a>
         <a href="./images/outletmix/outletmix_3.avif" class="hidden-image" data-thumb="./images/outletmix/outletmix_3.avif"
            data-title="Core Lockups"
            data-paragraph="A versatile brand requires a kit of parts that can shift based on the environment. These variations provide the tools needed to maintain a consistent look regardless of the medium. The shapes are defined by a mix of thick and thin strokes, mimicking the natural flow of an athlete in mid-stride. The standalone icon acts as the brand’s ´MVP´ a compact, powerful symbol of the Outletmix mission. The sharp angles on the bottom represent the firm ground of the starting block, while the flowing top represents the speed and grace of the finish line." ><img src="./images/outletmix/outletmix_3.avif" alt="" /></a>
         <a href="./images/outletmix/outletmix_4.avif"
            data-title="The Versatile Identity"
            data-paragraph="The Outletmix logo is built to thrive in the real world, from the high-glare lighting of a gym floor to the low-light atmosphere of a night run. This slide demonstrates the seamless transition between the positive and negative colorways. The structural weight of the icon and the typography was specifically tuned to prevent ´filling in´ when placed on dark backgrounds, ensuring the brand always looks premium. This level of flexibility allows for a diverse range of applications in apparel tagging, packaging, and high-impact signage without ever sacrificing the core aesthetic of the brand."><img alt="outletmix-4" src="./images/outletmix/outletmix_4.avif" /></a>
         <a href="./images/outletmix/outletmix_5.avif" class="hidden-image" data-thumb="./images/outletmix/outletmix_5.avif"
            data-title="The Active Presence"
            data-paragraph="Branding thrives when it moves with the wearer. By placing the Outletmix mark front and center on the chest, the identity becomes a badge of dedication for the athlete. The balanced proportions of the logo ensure it remains legible and impactful even during high-intensity movement. The interplay between the deep black fabric and the sharp white and red elements creates a premium look that feels at home in any high-end training facility, proving that accessibility never has to come at the expense of a clean, elite aesthetic."><img src="./images/outletmix/outletmix_5.avif" alt="" /></a>
         <a href="./images/outletmix/outletmix_6.avif" class="hidden-image" data-thumb="./images/outletmix/outletmix_6.avif"
            data-title="Lifestyle Integration"
            data-paragraph="The Outletmix identity is designed to flow naturally across a diverse range of silhouettes. When applied to women’s performance wear, the logo maintains its bold character while adapting to the softer tones of the apparel line. The contrast between the charcoal-gray typography and the soft pink fabric creates a look that is both approachable and professional. By utilizing the stacked lockup, the brand sits perfectly as a centerpiece, proving that the structural balance of the icon can command attention without overwhelming the garment’s overall aesthetic." ><img src="./images/outletmix/outletmix_6.avif" alt="" /></a>
         <a href="./images/outletmix/outletmix_7.avif"
            data-title="The Unboxing Experience"
            data-paragraph="The packaging is the first physical interaction a customer has with the brand, and it needs to convey quality before the box is even opened. By utilizing a topographic pattern across the lid, the design hints at outdoor performance and terrain, adding a layer of depth to the flat black surface. The horizontal lockup is positioned with plenty of breathing room, ensuring the red ´let´ and the white isotype pop against the dark texture. This execution transforms a standard shoe box into a premium vessel, reinforcing the idea that every piece of gear inside is a serious investment in the athlete’s journey."><img alt="outletmix-7" src="./images/outletmix/outletmix_7.avif" /></a>
         <a href="./images/outletmix/outletmix_8.avif" class="hidden-image" data-thumb="./images/outletmix/outletmix_8.avif"

            <!-- grid-items will be generated dynamically -->

        </div>
      </div>

      <!-- Slide layers in stacking order -->

      <div class="slider-image-bg"></div>
      <div class="slider-image-next"></div>
      <div class="transition-overlay" id="transition-overlay"></div>

      <div class="switch">

        </button>

  <style>
    .back-button.replica {
      position: fixed !important;
      bottom: 80px !important;
      right: 0px !important; /* Ajustado al borde derecho */
      z-index: 999999 !important; /* Por encima del overlay */
      display: none;
      opacity: 0.2 !important;
      transition: opacity 0.3s ease !important;
      visibility: visible !important;
      pointer-events: auto !important;
      cursor: pointer !important;
    }
    .back-button.replica:hover {
      opacity: 1 !important;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Crear botón réplica
      const replicaBtn = document.createElement('div');
      replicaBtn.id = 'backButtonReplica';
      replicaBtn.className = 'back-button replica';
      document.body.appendChild(replicaBtn);

      // Sincronizar contenido y eventos del botón original
      const syncReplica = () => {
        const orig = document.getElementById('backButton');
        if (orig) {
          replicaBtn.innerHTML = orig.innerHTML;
          // Copiar clases base pero mantener la clase replica
          replicaBtn.className = (orig.className || 'back-button') + ' replica';
          replicaBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (orig) orig.click();
          };
        }
      };

      // Observar cambios en el DOM para detectar el overlay y el botón original
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((m) => {
          if (m.addedNodes.length) {
            setTimeout(syncReplica, 0);
            
            m.addedNodes.forEach(node => {
              if (node.classList && node.classList.contains('image-structure-overlay')) {
                setupOverlayListeners(node);
              }
            });
          }
          if (m.removedNodes.length) {
            m.removedNodes.forEach(node => {
              if (node.classList && node.classList.contains('image-structure-overlay')) {
                const orig = document.getElementById('backButton');
                if (orig) orig.style.display = '';
                replicaBtn.style.display = 'none';
              }
            });
          }
        });
      });
      observer.observe(document.body, { childList: true });

      function setupOverlayListeners(overlay) {
        const sliderBtn = overlay.querySelector('.switch-button-slider');
        let transitionTimeout;

        const updateState = (isInitial = false) => {
          const orig = document.getElementById('backButton');
          if (orig) syncReplica();
          
          clearTimeout(transitionTimeout);

          if (sliderBtn && sliderBtn.classList.contains('switch-button-current')) {
            // Modo Slider
            if (orig) orig.style.display = 'none';
            replicaBtn.style.display = 'none';
            
            // Mostrar réplica tras expansión (aprox 1s)
            transitionTimeout = setTimeout(() => {
              replicaBtn.style.display = 'flex';
            }, isInitial ? 0 : 1050);
          } else {
            // Modo Grid
            replicaBtn.style.display = 'none';
            if (orig) {
              if (!isInitial) orig.style.display = 'none';
              transitionTimeout = setTimeout(() => {
                if (orig) orig.style.display = '';
              }, isInitial ? 0 : 1050);
            }
          }
        };

        if (sliderBtn) {
          const btnObserver = new MutationObserver(() => updateState(false));
          btnObserver.observe(sliderBtn, { attributes: true, attributeFilter: ['class'] });
          // Verificar estado inicial
          setTimeout(() => updateState(true), 100);
        }
      }
      
      // Intento inicial de sincronización
      syncReplica();
    });
  </script>
