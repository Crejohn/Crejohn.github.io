<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crejohn Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 24px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #555555;
            margin-bottom: 8px;
        }
        .location {
            font-size: 0.95rem;
            color: #777777;
            margin-bottom: 32px;
        }
        .message {
            font-size: 1.25rem;
            font-weight: 400;
            color: #222222;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace the src with your uploaded logo asset path or base64 string -->
        <img src="crejohn_design.png" alt="Crejohn Design Logo" class="logo">
        
        <div class="title">Senior Graphic Designer</div>
        <div class="location">Caracas, Venezuela</div>
        
        <p class="message">This site is currently being updated.</p>
    </div>

</body>
</html>
